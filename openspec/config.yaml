schema: spec-driven

context: |
  This is a take-home exercise: keep everything simple, focused and explainable.
  Prefer the simplest design that still reasons well; document known pitfalls in
  the README instead of building for them. Backend only, no frontend.
  Stack is fixed: Node.js, TypeScript, NestJS, GraphQL, Prisma, Postgres, Redis, Docker.
  Everything must run with Docker alone (one command to start, one to test).
  Write all artifacts in English; reviewers read them.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
